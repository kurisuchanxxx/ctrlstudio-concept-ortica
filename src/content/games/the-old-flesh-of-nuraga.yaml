title: The Old Flesh of Nuraga
genre: Cosmic horror
featured: false

# Official Steam short description.
logline: Your Grandpa descends into madness in a family cosmic horror. Dig cursed relics, meet eldritch beings, and awaken a forgotten God.
# Official Steam copy ("About this game").
description:
  - On the barren island of Nuraga, you're stranded in the desert with your Grandpa. Your bull died of exhaustion, and Grandpa is too tired to march. Luckily, you've found shelter in ancient ruins where Grandpa can rest and you can look for food beneath the sand.
  - But when instead of desert potatoes you dig up ancient relics, Grandpa starts acting strange. He pushes you to dig deeper and deeper, heedless of the eerie atmosphere that permeates the ruins and the mysterious events happening around you.
shortDescription: A short narrative psychological horror game with treasure hunting, branching dialogues and multiple endings, 1 to 2 hours long.

