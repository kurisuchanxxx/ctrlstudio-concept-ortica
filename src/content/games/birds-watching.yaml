title: Birds Watching
genre: Psychological horror
featured: false

# Adapted from the official Steam copy.
logline: An endless fire destroyed the world. You are the last human being, and the only ones who can save you are the birds.
# Official Steam copy ("About this game").
description:
  - An endless global fire destroyed the world, and you are now alone, the last human being. You survive on the top of a mountain, the only place still untouched by the flames, and your only occupation is watching with your binoculars the wild birds escaped up there with you.
  - It is a peaceful, isolated, desperate life. Until you are not alone anymore, and the only ones who can save you are the birds; but they are picky. Satisfy them, or lose everything. Be honest. Be ruthless. Be careful.
shortDescription: A short psychological horror game about bird watching, around 60 minutes long, set on the last mountain untouched by an endless global fire.

