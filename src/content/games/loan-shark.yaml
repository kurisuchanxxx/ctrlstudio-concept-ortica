# TODO(copy): logline and descriptions are drafts. Replace with the official Steam copy or validate.
logline: Out on the water, a debt that can never be paid keeps pulling at the line.
description:
  - Loan Shark is a short fishing horror game about an impossible debt. It takes the slow, patient rhythm of fishing, casting, waiting, reeling in, and lets the weight of what you owe seep into every quiet moment on the water.
  - Like every Studio Ortica game, it is designed to be played in a single sitting. It was the studio's first release, on Steam in August 2025 and on Xbox Series in January 2026, and a finalist for Best Italian Debut Game at the Italian Video Game Awards 2026.
shortDescription: A short fishing horror game about an impossible debt, designed to be played in a single sitting.

