# Official Steam short description.
logline: The loan shark is coming for you. Catch enough fish to repay your debt before it is too late. Go fish.
# Official Steam copy ("About this game").
description:
  - You are an angler haunted by huge debts. In the midst of yet another night working at sea, you catch something different, a fish which talks, and promises to make you rich... but at what cost?
  - A brief fishing horror game about debt and hopelessness, around 30 minutes long. Enjoy a twisted cautionary tale in one sitting.
