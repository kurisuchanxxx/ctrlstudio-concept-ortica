formula: We make short, narrative driven horror games. You fish, you watch birds, you dig. Then something stings.

# TODO(copy): the three lines of the What we make block. Draft in the studio's voice.
manifesto:
  - Short, narrative driven horror games you can finish in one evening.
  - Each one starts with something calm. Fishing at night. Watching birds. Digging in the sand with Grandpa.
  - Then something bites back.

# Short description adapted from the official Linktree bio.
shortDescription: Studio Ortica is an indie game studio from Turin, Italy, founded in 2025 by former AA developers. It makes short, narrative driven horror games, designed to be played in a single sitting.
# TODO(copy): long description is a draft built on verified facts. Validate with the studio.
longDescription:
  - Studio Ortica is an independent game studio based in Turin, Italy, founded in 2025 by developers coming from AA productions. The team works in Godot.
  - Its games share one signature. Each takes a quiet activity built on patient observation, such as fishing, birdwatching or excavation, and slowly turns it into horror. They are short and narrative, meant to be finished in one sitting, from about thirty minutes to a couple of hours.
  - Its first game, Loan Shark, a fishing horror about an impossible debt, was a finalist for Best Italian Debut Game at the Italian Video Game Awards 2026. Console versions of Loan Shark and Birds Watching are published by Dark Product, based in Busan, South Korea.

